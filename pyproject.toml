[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uriel-v2"
version = "1.0.0"
description = "Reproducible stochastic algorithm and Korean Lotto 6/45 experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
uriel = "uriel_v2.cli:main"
uriel-probabilistic = "uriel_v2.probabilistic_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
